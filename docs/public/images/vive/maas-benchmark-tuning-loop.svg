<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="benchmark-tuning-title benchmark-tuning-desc">
  <title id="benchmark-tuning-title">MaaS性能ベンチマークの入力・出力とvLLM設定調整</title>
  <desc id="benchmark-tuning-desc">左側の入力は、GuideLLMのワークロード条件と、デプロイ時のvLLM設定の二つに分かれる。両方をOpenShift上のvLLM MaaSエンドポイントへ与え、右側でGuideLLM性能結果とOpenShiftのPromQLメトリクスを同じ時間帯で確認する。人が結果をレビューして次のワークロード条件とvLLM設定を判断する。これは自動チューニングや因果関係の断定を示すものではなく、回答品質評価は別に行う。gpu-memory-utilizationはvLLMの設定値であり、測定されたGPU利用率ではない。</desc>

  <defs>
    <marker id="tuning-arrow-solid"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F80ED"/>
    </marker>
    <marker id="tuning-arrow-review"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#F2994A"/>
    </marker>
    <filter id="tuning-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173B5E" flood-opacity="0.12"/>
    </filter>
    <style>
      text {
        font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      }
      .section-label {
        font-size: 18px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .card-title {
        font-size: 20px;
        font-weight: 700;
        fill: #1F2937;
      }
      .card-text {
        font-size: 16px;
        font-weight: 600;
        fill: #314254;
      }
      .flag-text {
        font-family: "Noto Sans Mono", "Consolas", monospace;
        font-size: 15px;
        font-weight: 700;
        fill: #1F2937;
      }
      .small-note {
        font-size: 15px;
        font-weight: 600;
      }
      .solid-flow {
        fill: none;
        stroke: #2F80ED;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#tuning-arrow-solid);
      }
      .review-flow {
        fill: none;
        stroke: #F2994A;
        stroke-width: 4;
        stroke-dasharray: 10 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#tuning-arrow-review);
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#F6F8FB"/>
  <rect width="1200" height="72" fill="#173B5E"/>
  <rect y="68" width="1200" height="4" fill="#2F80ED"/>
  <text x="600"
        y="46"
        text-anchor="middle"
        font-size="30"
        font-weight="700"
        fill="#FFFFFF">MaaS性能ベンチマーク：2つの入力と2つの出力</text>

  <!-- Column labels -->
  <rect x="36" y="90" width="326" height="38" rx="12" fill="#2F80ED"/>
  <text class="section-label" x="199" y="116" text-anchor="middle">INPUT：評価・デプロイ条件</text>

  <rect x="431" y="90" width="338" height="38" rx="12" fill="#2E8B57"/>
  <text class="section-label" x="600" y="116" text-anchor="middle">MaaS：評価対象</text>

  <rect x="838" y="90" width="326" height="38" rx="12" fill="#7B61A8"/>
  <text class="section-label" x="1001" y="116" text-anchor="middle">OUTPUT：性能・基盤指標</text>

  <!-- Input cards -->
  <g filter="url(#tuning-shadow)">
    <rect x="36" y="144" width="326" height="168" rx="18" fill="#FFFFFF" stroke="#8BC0F5" stroke-width="2.5"/>
    <rect x="36" y="330" width="326" height="184" rx="18" fill="#FFFFFF" stroke="#8BC0F5" stroke-width="2.5"/>
  </g>

  <circle cx="66" cy="174" r="18" fill="#2F80ED"/>
  <text x="66" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
  <text class="card-title" x="94" y="181">GuideLLM SWEEP条件</text>
  <text class="card-text" x="60" y="214">• 入力データのバリエーション</text>
  <text class="card-text" x="60" y="240">• 入力／出力トークン長</text>
  <text class="card-text" x="60" y="266">• Profile／Request rate</text>
  <text class="card-text" x="60" y="292">• 同時リクエスト数（Concurrency）</text>

  <circle cx="66" cy="360" r="18" fill="#2F80ED"/>
  <text x="66" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
  <text class="card-title" x="94" y="367">vLLMデプロイ設定</text>
  <text class="flag-text" x="60" y="401">--max-model-len</text>
  <text class="flag-text" x="60" y="427">--max-num-seqs</text>
  <text class="flag-text" x="60" y="453">--max-num-batched-tokens</text>
  <text class="flag-text" x="60" y="479">--gpu-memory-utilization</text>
  <text x="60" y="502" font-size="15" font-weight="700" fill="#A85412">設定値 ≠ 測定されたGPU利用率</text>

  <!-- Center target -->
  <g filter="url(#tuning-shadow)">
    <rect x="431" y="170" width="338" height="314" rx="22" fill="#EAF7EF" stroke="#2E8B57" stroke-width="3"/>
    <rect x="469" y="209" width="262" height="89" rx="17" fill="#FFFFFF" stroke="#8BCBA6" stroke-width="2"/>
    <rect x="469" y="323" width="262" height="116" rx="17" fill="#FFFFFF" stroke="#8BCBA6" stroke-width="2"/>
  </g>

  <text x="600" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#1F6B45">閉域環境</text>
  <text class="card-title" x="600" y="244" text-anchor="middle">OpenShift</text>
  <text class="card-text" x="600" y="272" text-anchor="middle">配置・実行・資源管理</text>

  <text class="card-title" x="600" y="358" text-anchor="middle">vLLM MaaSエンドポイント</text>
  <text class="card-text" x="600" y="388" text-anchor="middle">選択したモデル／GPU構成</text>
  <text class="card-text" x="600" y="416" text-anchor="middle">デプロイ設定を反映して性能評価</text>

  <!-- Output cards -->
  <g filter="url(#tuning-shadow)">
    <rect x="838" y="144" width="326" height="168" rx="18" fill="#FFFFFF" stroke="#BFAFD8" stroke-width="2.5"/>
    <rect x="838" y="330" width="326" height="184" rx="18" fill="#FFFFFF" stroke="#BFAFD8" stroke-width="2.5"/>
  </g>

  <circle cx="868" cy="174" r="18" fill="#7B61A8"/>
  <text x="868" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
  <text class="card-title" x="896" y="181">GuideLLM性能結果</text>
  <text class="card-text" x="862" y="216">• スループット</text>
  <text class="card-text" x="862" y="243">• TTFT／ITL／E2Eレイテンシ</text>
  <text class="card-text" x="862" y="270">• 成功率／エラー</text>
  <text x="862" y="295" font-size="15" font-weight="700" fill="#7B61A8">回答品質評価とは別</text>

  <circle cx="868" cy="360" r="18" fill="#7B61A8"/>
  <text x="868" y="367" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
  <text class="card-title" x="896" y="367">OpenShift／PromQL</text>
  <text class="card-text" x="862" y="401">• Prefill／Decode</text>
  <text class="card-text" x="862" y="427">• Queue／Wait、KVキャッシュ</text>
  <text class="card-text" x="862" y="453">• CPU／GPU／Tensor Core</text>
  <text x="862" y="480" font-size="15" font-weight="700" fill="#7B61A8">同じ時間帯のグラフで関係を確認</text>
  <text x="862" y="501" font-size="15" font-weight="700" fill="#A85412">因果関係までは断定しない</text>

  <!-- Primary measurement flows -->
  <path class="solid-flow" d="M364 228 H416"/>
  <path class="solid-flow" d="M364 422 H416"/>
  <path class="solid-flow" d="M771 228 H823"/>
  <path class="solid-flow" d="M771 422 H823"/>

  <!-- Human review loop -->
  <path class="review-flow" d="M1001 516 V539 H800"/>
  <path class="review-flow" d="M430 601 H14 V228 H30"/>
  <path class="review-flow" d="M430 625 H24 V422 H30"/>

  <g filter="url(#tuning-shadow)">
    <rect x="430" y="540" width="570" height="96" rx="20" fill="#FFF5E8" stroke="#F2994A" stroke-width="3"/>
  </g>
  <circle cx="468" cy="574" r="17" fill="#F2994A"/>
  <path d="M460 574 L466 580 L477 567" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="495" y="578" font-size="20" font-weight="700" fill="#1F2937">人がレビューし、次の条件を判断</text>
  <text x="462" y="607" font-size="15" font-weight="700" fill="#536476">次のワークロード条件／vLLM設定を調整</text>
  <text x="462" y="628" font-size="15" font-weight="700" fill="#A85412">現在は人手。自動チューニングではない</text>

  <text x="44" y="655" font-size="15" font-weight="700" fill="#A85412">点線：人の判断によるフィードバック</text>
  <text x="1158" y="655" text-anchor="end" font-size="15" font-weight="700" fill="#536476">性能評価の図。回答品質は別の観点・手順で評価する</text>
</svg>
