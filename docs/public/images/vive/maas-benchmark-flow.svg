<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="benchmark-flow-title benchmark-flow-desc">
  <title id="benchmark-flow-title">MaaS性能ベンチマーク・分析の自動化フロー</title>
  <desc id="benchmark-flow-desc">権限を持つ社内利用者または定期バッチが共通テンプレートからGuideLLMを実行し、閉域MaaSの複数モデルの性能を評価する。回答品質評価は別に扱う。入力が許可されたExcelテンプレート、GuideLLM評価結果のtarファイル、Pod起動ログを、承認済み領域のMicrosoft 365 Copilot Agent「ベンチ評価ブック作成」へ渡す。Agentは評価ブックを作成し、時間同期したvLLMメトリクスは別の依頼で追加評価する。人が結果を確認して最終判断し、次の評価条件へ戻す。実線は自動または同一領域内の処理、点線は人とルールを介した受け渡しを示し、Copilotから閉域MaaSへは直接接続しない。</desc>

  <defs>
    <marker id="benchmark-arrow-solid"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F80ED"/>
    </marker>
    <marker id="benchmark-arrow-dashed"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#F2994A"/>
    </marker>
    <filter id="benchmark-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173B5E" flood-opacity="0.12"/>
    </filter>
    <style>
      text {
        font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      }
      .region-title {
        font-size: 20px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .card-title {
        font-size: 19px;
        font-weight: 700;
        fill: #1F2937;
      }
      .card-text {
        font-size: 17px;
        font-weight: 600;
        fill: #1F2937;
      }
      .small-note {
        font-size: 15px;
        font-weight: 600;
      }
      .solid-flow {
        fill: none;
        stroke: #2F80ED;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#benchmark-arrow-solid);
      }
      .mediated-flow {
        fill: none;
        stroke: #F2994A;
        stroke-width: 5;
        stroke-dasharray: 10 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#benchmark-arrow-dashed);
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#F6F8FB"/>
  <rect width="1200" height="72" fill="#173B5E"/>
  <rect y="68" width="1200" height="4" fill="#2F80ED"/>
  <text x="600"
        y="46"
        text-anchor="middle"
        font-size="30"
        font-weight="700"
        fill="#FFFFFF">MaaS性能ベンチマーク・分析の自動化フロー</text>

  <!-- MaaS evaluation execution area -->
  <rect x="36" y="94" width="1128" height="205" rx="22" fill="#EAF7EF" stroke="#2E8B57" stroke-width="3"/>
  <rect x="56" y="110" width="316" height="38" rx="12" fill="#2E8B57"/>
  <text class="region-title" x="214" y="136" text-anchor="middle">MaaS評価実行領域（閉域）</text>
  <text x="1138" y="136" text-anchor="end" font-size="16" font-weight="700" fill="#1F6B45">領域内の共通フロー</text>

  <!-- Evaluation data management area -->
  <rect x="36" y="330" width="770" height="230" rx="22" fill="#EAF4FF" stroke="#2F80ED" stroke-width="3"/>
  <rect x="56" y="346" width="244" height="38" rx="12" fill="#2F80ED"/>
  <text class="region-title" x="178" y="372" text-anchor="middle">評価データ管理領域</text>

  <!-- Approved Copilot area -->
  <rect x="830" y="330" width="334" height="230" rx="22" fill="#F2ECFA" stroke="#7B61A8" stroke-width="3"/>
  <rect x="850" y="346" width="294" height="38" rx="12" fill="#7B61A8"/>
  <text class="region-title" x="997" y="372" text-anchor="middle">Copilot利用承認済み領域</text>

  <!-- Solid, automated or in-area flow -->
  <path class="solid-flow" d="M248 210 H266"/>
  <path class="solid-flow" d="M457 210 H476"/>
  <path class="solid-flow" d="M622 210 H641"/>
  <path class="solid-flow" d="M877 210 H896"/>
  <path class="solid-flow" d="M282 445 H326"/>

  <!-- Dashed, human- and rule-mediated flow -->
  <path class="mediated-flow" d="M1017 254 V314 H305 V445 H284"/>
  <path class="mediated-flow" d="M577 445 H856"/>
  <path class="mediated-flow" d="M858 485 C830 485, 824 518, 789 518"/>
  <path class="mediated-flow" d="M567 518 H22 V282 H362 V256"/>

  <!-- Execution cards -->
  <g filter="url(#benchmark-shadow)">
    <rect x="56" y="168" width="190" height="84" rx="16" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="270" y="168" width="185" height="84" rx="16" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="480" y="168" width="140" height="84" rx="16" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="645" y="168" width="230" height="84" rx="16" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="900" y="168" width="235" height="84" rx="16" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
  </g>

  <text class="card-text" x="151" y="191" text-anchor="middle">権限を持つ</text>
  <text class="card-text" x="151" y="213" text-anchor="middle">社内利用者 または</text>
  <text class="card-text" x="151" y="235" text-anchor="middle">定期バッチ</text>

  <text class="card-title" x="362.5" y="204" text-anchor="middle">共通ベンチマーク</text>
  <text class="card-text" x="362.5" y="229" text-anchor="middle">テンプレート</text>

  <text class="card-title" x="550" y="217" text-anchor="middle">GuideLLM</text>

  <text class="card-title" x="760" y="204" text-anchor="middle">閉域MaaS</text>
  <text class="card-text" x="760" y="229" text-anchor="middle">エンドポイント／モデル</text>

  <text class="card-title" x="1017.5" y="204" text-anchor="middle">性能評価結果</text>
  <text class="card-text" x="1017.5" y="229" text-anchor="middle">性能指標／実行条件</text>

  <!-- Result transfer label -->
  <rect x="530" y="301" width="154" height="27" rx="13.5" fill="#FFFFFF" stroke="#F6C48F" stroke-width="1.5"/>
  <text class="small-note" x="607" y="320" text-anchor="middle" fill="#A85412">所定手順で保存</text>

  <!-- Data management cards -->
  <g filter="url(#benchmark-shadow)">
    <rect x="60" y="405" width="220" height="80" rx="16" fill="#FFFFFF" stroke="#A8CFF8" stroke-width="2"/>
    <rect x="330" y="405" width="245" height="80" rx="16" fill="#FFFFFF" stroke="#A8CFF8" stroke-width="2"/>
    <rect x="567" y="474" width="218" height="68" rx="16" fill="#FFFFFF" stroke="#F2994A" stroke-width="2.5"/>
  </g>

  <text class="card-title" x="170" y="437" text-anchor="middle">評価データ保存</text>
  <text class="card-text" x="170" y="463" text-anchor="middle">履歴・追跡</text>

  <text class="card-title" x="452.5" y="430" text-anchor="middle">Agentへの入力</text>
  <text x="452.5" y="453" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">初回：Excel／tar／Podログ</text>
  <text x="452.5" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">別依頼：同期済みvLLMメトリクス</text>

  <circle cx="594" cy="508" r="15" fill="#FFF2E2" stroke="#F2994A" stroke-width="2"/>
  <path d="M586 508 L592 514 L603 501" fill="none" stroke="#F2994A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="610" y="503" font-size="18" font-weight="700" fill="#1F2937">人が確認・最終判断</text>
  <text x="610" y="526" font-size="15" font-weight="600" fill="#536476">性能比較／GPU設計</text>

  <!-- Copilot card -->
  <g filter="url(#benchmark-shadow)">
    <rect x="860" y="400" width="274" height="110" rx="18" fill="#FFFFFF" stroke="#BFAFD8" stroke-width="2"/>
  </g>
  <text x="997" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">ベンチ評価ブック作成</text>
  <text class="card-text" x="997" y="455" text-anchor="middle">Microsoft 365 Copilot Agent</text>
  <text x="997" y="482" text-anchor="middle" font-size="16" font-weight="700" fill="#7B61A8">ブック作成・追加評価</text>

  <!-- Transfer annotations -->
  <rect x="662" y="425" width="132" height="27" rx="13.5" fill="#FFFFFF" stroke="#F6C48F" stroke-width="1.5"/>
  <text class="small-note" x="728" y="444" text-anchor="middle" fill="#A85412">許可データのみ</text>
  <text class="small-note" x="823" y="510" text-anchor="middle" fill="#A85412">分析支援</text>
  <rect x="287" y="528" width="140" height="27" rx="13.5" fill="#FFFFFF" stroke="#F6C48F" stroke-width="1.5"/>
  <text class="small-note" x="357" y="547" text-anchor="middle" fill="#A85412">次の評価条件</text>

  <!-- Legend and boundary statement -->
  <rect x="36" y="582" width="1128" height="75" rx="20" fill="#173B5E"/>
  <path d="M64 609 H121" fill="none" stroke="#67A7F5" stroke-width="5" stroke-linecap="round"/>
  <text x="138" y="616" font-size="17" font-weight="700" fill="#FFFFFF">自動／同一領域内</text>
  <path d="M331 609 H388" fill="none" stroke="#F6B878" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <text x="405" y="616" font-size="17" font-weight="700" fill="#FFFFFF">人とルールを介す</text>

  <circle cx="682" cy="621" r="18" fill="#D64545"/>
  <path d="M674 613 L690 629 M690 613 L674 629" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="710" y="628" font-size="18" font-weight="700" fill="#FFFFFF">Copilotから閉域MaaSへ直接接続しない</text>
</svg>
