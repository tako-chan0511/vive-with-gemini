<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="agent-book-title agent-book-desc">
  <title id="agent-book-title">Copilot Agentによる評価ブック作成の流れ</title>
  <desc id="agent-book-desc">Excelテンプレート、GuideLLM結果のtarファイル、Pod起動ログをMicrosoft 365 Copilot Agentのベンチ評価ブック作成へ入力する。Agentは評価ブック、比較表、グラフ、関係者へ共有可能な成果物を作成し、人が内容を確認してモデル選定とGPU構成を最終判断する。</desc>

  <defs>
    <marker id="agent-arrow-solid"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F80ED"/>
    </marker>
    <marker id="agent-arrow-human"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#F2994A"/>
    </marker>
    <filter id="agent-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173B5E" flood-opacity="0.12"/>
    </filter>
    <style>
      text {
        font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      }
      .section-label {
        font-size: 18px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .card-title {
        font-size: 20px;
        font-weight: 700;
        fill: #1F2937;
      }
      .card-text {
        font-size: 17px;
        font-weight: 600;
        fill: #314254;
      }
      .small-note {
        font-size: 15px;
        font-weight: 600;
        fill: #536476;
      }
      .solid-flow {
        fill: none;
        stroke: #2F80ED;
        stroke-width: 5;
        stroke-linecap: round;
        marker-end: url(#agent-arrow-solid);
      }
      .human-flow {
        fill: none;
        stroke: #F2994A;
        stroke-width: 5;
        stroke-dasharray: 10 8;
        stroke-linecap: round;
        marker-end: url(#agent-arrow-human);
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#F6F8FB"/>
  <rect width="1200" height="72" fill="#173B5E"/>
  <rect y="68" width="1200" height="4" fill="#2F80ED"/>
  <text x="600"
        y="46"
        text-anchor="middle"
        font-size="30"
        font-weight="700"
        fill="#FFFFFF">Copilot Agentによる評価ブック作成の流れ</text>

  <!-- Stage labels -->
  <rect x="36" y="92" width="250" height="38" rx="12" fill="#2F80ED"/>
  <text class="section-label" x="161" y="118" text-anchor="middle">INPUT：評価データ</text>

  <rect x="326" y="92" width="260" height="38" rx="12" fill="#7B61A8"/>
  <text class="section-label" x="456" y="118" text-anchor="middle">AGENT：作成支援</text>

  <rect x="626" y="92" width="300" height="38" rx="12" fill="#2E8B57"/>
  <text class="section-label" x="776" y="118" text-anchor="middle">OUTPUT：標準化した成果物</text>

  <rect x="966" y="92" width="198" height="38" rx="12" fill="#F2994A"/>
  <text class="section-label" x="1065" y="118" text-anchor="middle">HUMAN</text>

  <!-- Main stage cards -->
  <g filter="url(#agent-shadow)">
    <rect x="36" y="150" width="250" height="355" rx="20" fill="#EAF4FF" stroke="#2F80ED" stroke-width="3"/>
    <rect x="326" y="150" width="260" height="355" rx="20" fill="#F2ECFA" stroke="#7B61A8" stroke-width="3"/>
    <rect x="626" y="150" width="300" height="355" rx="20" fill="#EAF7EF" stroke="#2E8B57" stroke-width="3"/>
    <rect x="966" y="150" width="198" height="355" rx="20" fill="#FFF5E8" stroke="#F2994A" stroke-width="3"/>
  </g>

  <!-- Input -->
  <circle cx="66" cy="181" r="18" fill="#2F80ED"/>
  <text x="66" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
  <text class="card-title" x="94" y="188">3種類の入力</text>

  <g filter="url(#agent-shadow)">
    <rect x="58" y="213" width="206" height="64" rx="14" fill="#FFFFFF" stroke="#A8CFF8" stroke-width="2"/>
    <rect x="58" y="294" width="206" height="72" rx="14" fill="#FFFFFF" stroke="#A8CFF8" stroke-width="2"/>
    <rect x="58" y="383" width="206" height="64" rx="14" fill="#FFFFFF" stroke="#A8CFF8" stroke-width="2"/>
  </g>
  <text class="card-text" x="161" y="251" text-anchor="middle">Excelテンプレート</text>
  <text class="card-text" x="161" y="323" text-anchor="middle">GuideLLM結果の</text>
  <text class="card-text" x="161" y="347" text-anchor="middle">tarファイル</text>
  <text class="card-text" x="161" y="421" text-anchor="middle">Pod起動ログ</text>
  <text class="small-note" x="161" y="480" text-anchor="middle">許可された評価データのみ</text>

  <!-- Agent -->
  <circle cx="356" cy="181" r="18" fill="#7B61A8"/>
  <text x="356" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
  <text class="card-title" x="384" y="188">Agent</text>

  <g filter="url(#agent-shadow)">
    <rect x="348" y="218" width="216" height="190" rx="18" fill="#FFFFFF" stroke="#BFAFD8" stroke-width="2.5"/>
  </g>
  <circle cx="456" cy="260" r="25" fill="#7B61A8"/>
  <path d="M445 260 L453 268 L468 251" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="456" y="311" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Microsoft 365</text>
  <text x="456" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Copilot Agent</text>
  <text x="456" y="372" text-anchor="middle" font-size="19" font-weight="700" fill="#7B61A8">ベンチ評価ブック作成</text>
  <rect x="365" y="430" width="182" height="36" rx="18" fill="#FFFFFF" stroke="#BFAFD8" stroke-width="1.5"/>
  <text class="small-note" x="456" y="454" text-anchor="middle">所定テンプレートに則る</text>

  <!-- Output -->
  <circle cx="656" cy="181" r="18" fill="#2E8B57"/>
  <text x="656" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
  <text class="card-title" x="684" y="188">共有しやすい形式へ</text>

  <g filter="url(#agent-shadow)">
    <rect x="648" y="211" width="256" height="52" rx="14" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="648" y="278" width="256" height="52" rx="14" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="648" y="345" width="256" height="52" rx="14" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
    <rect x="648" y="412" width="256" height="70" rx="14" fill="#FFFFFF" stroke="#A9D8BD" stroke-width="2"/>
  </g>
  <text class="card-text" x="776" y="244" text-anchor="middle">評価ブック</text>
  <text class="card-text" x="776" y="311" text-anchor="middle">比較表</text>
  <text class="card-text" x="776" y="378" text-anchor="middle">グラフ</text>
  <text class="card-text" x="776" y="442" text-anchor="middle">関係者へ共有可能な</text>
  <text class="card-text" x="776" y="466" text-anchor="middle">成果物</text>

  <!-- Human review -->
  <circle cx="996" cy="181" r="18" fill="#F2994A"/>
  <text x="996" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1065" y="218" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">人による</text>
  <text x="1065" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">確認・判断</text>

  <g filter="url(#agent-shadow)">
    <rect x="984" y="275" width="162" height="62" rx="14" fill="#FFFFFF" stroke="#F6C48F" stroke-width="2"/>
    <rect x="984" y="355" width="162" height="62" rx="14" fill="#FFFFFF" stroke="#F6C48F" stroke-width="2"/>
  </g>
  <text class="card-text" x="1065" y="313" text-anchor="middle">モデル選定</text>
  <text class="card-text" x="1065" y="393" text-anchor="middle">GPU構成判断</text>
  <text x="1065" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#A85412">最終判断は人</text>

  <!-- Flows -->
  <path class="solid-flow" d="M290 327 H312"/>
  <path class="solid-flow" d="M590 327 H612"/>
  <path class="human-flow" d="M930 327 H952"/>

  <!-- Key message -->
  <rect x="36" y="545" width="1128" height="94" rx="20" fill="#173B5E"/>
  <text x="600" y="582" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">測定結果を、人が使い・共有できる評価ブックへ標準化</text>
  <text x="600" y="613" text-anchor="middle" font-size="17" font-weight="600" fill="#DDEBFA">Agentは作成を支援し、モデル選定とGPU構成の最終判断は人が担う</text>
  <circle cx="56" cy="657" r="6" fill="#F2994A"/>
  <text x="72" y="662" font-size="15" font-weight="700" fill="#536476">入力 → Copilot Agent → 出力 → 人による確認・判断</text>
</svg>
