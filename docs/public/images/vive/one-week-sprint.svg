<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="one-week-title one-week-desc">
  <title id="one-week-title">1週間ごとに、動く成果物と学びを返す</title>
  <desc id="one-week-desc">GitLab IssueとMerge Requestを中心に、リファインメントからレトロスペクティブまでの6工程を1週間で循環させ、ユーザーの声と次週の改善へつなぐ図。</desc>

  <defs>
    <linearGradient id="one-week-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6F9"/>
    </linearGradient>
    <filter id="one-week-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173B5E" flood-opacity="0.14"/>
    </filter>
    <marker id="one-week-arrow"
            markerWidth="13"
            markerHeight="13"
            refX="10"
            refY="6.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2F80ED"/>
    </marker>
    <marker id="one-week-arrow-orange"
            markerWidth="13"
            markerHeight="13"
            refX="10"
            refY="6.5"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#F2994A"/>
    </marker>
  </defs>

  <g font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" fill="#1F2937">
    <rect width="1200" height="675" fill="url(#one-week-bg)"/>
    <rect width="1200" height="72" fill="#173B5E"/>
    <rect x="0" y="68" width="1200" height="4" fill="#2F80ED"/>
    <text x="600"
          y="45"
          text-anchor="middle"
          font-size="31"
          font-weight="700"
          fill="#FFFFFF">1週間ごとに、動く成果物と学びを返す</text>

    <!-- 1週間の循環を示す太い矢印 -->
    <g fill="none"
       stroke="#2F80ED"
       stroke-width="8"
       stroke-linecap="round"
       marker-end="url(#one-week-arrow)">
      <path d="M320 150 C370 121 425 121 475 141"/>
      <path d="M725 141 C775 121 830 121 880 150"/>
      <path d="M1095 187 C1144 222 1144 375 1095 410"/>
      <path d="M880 451 C830 480 775 480 725 466"/>
      <path d="M475 466 C425 480 370 480 320 451"/>
      <path d="M70 410 C23 375 23 222 70 187"/>
    </g>

    <!-- 次週への改善 -->
    <g filter="url(#one-week-shadow)">
      <rect x="20" y="275" width="142" height="42" rx="21" fill="#FFF2E2" stroke="#F2994A" stroke-width="2"/>
      <text x="91"
            y="302"
            text-anchor="middle"
            font-size="16"
            font-weight="700"
            fill="#A85412">次週の改善</text>
    </g>

    <!-- 中央ハブ -->
    <g filter="url(#one-week-shadow)">
      <rect x="390" y="222" width="420" height="176" rx="24" fill="#FFFFFF" stroke="#173B5E" stroke-width="4"/>
      <rect x="390" y="222" width="420" height="12" rx="6" fill="#2F80ED"/>
      <text x="600"
            y="271"
            text-anchor="middle"
            font-size="25"
            font-weight="700"
            fill="#173B5E">GitLab Issue／Merge Request</text>
      <text x="600"
            y="302"
            text-anchor="middle"
            font-size="15"
            font-weight="500"
            fill="#536476">要望・変更・検証・判断を一か所に集約</text>
      <line x1="435" y1="319" x2="765" y2="319" stroke="#D9E2EC" stroke-width="2"/>
      <rect x="455" y="338" width="290" height="42" rx="21" fill="#F2ECFA" stroke="#7B61A8" stroke-width="2"/>
      <circle cx="483" cy="359" r="8" fill="#7B61A8"/>
      <text x="610"
            y="366"
            text-anchor="middle"
            font-size="19"
            font-weight="700"
            fill="#5C4681">AIが各工程を支援</text>
    </g>

    <!-- 1 リファインメント -->
    <g filter="url(#one-week-shadow)">
      <rect x="70" y="105" width="250" height="82" rx="18" fill="#EAF4FF" stroke="#2F80ED" stroke-width="3"/>
      <circle cx="107" cy="146" r="23" fill="#2F80ED"/>
      <text x="107" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
      <text x="212" y="153" text-anchor="middle" font-size="18" font-weight="700">リファインメント</text>
    </g>

    <!-- 2 プランニング -->
    <g filter="url(#one-week-shadow)">
      <rect x="475" y="92" width="250" height="82" rx="18" fill="#F2ECFA" stroke="#7B61A8" stroke-width="3"/>
      <circle cx="512" cy="133" r="23" fill="#7B61A8"/>
      <text x="512" y="141" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
      <text x="610" y="140" text-anchor="middle" font-size="19" font-weight="700">プランニング</text>
    </g>

    <!-- 3 実装・検証 -->
    <g filter="url(#one-week-shadow)">
      <rect x="880" y="105" width="250" height="82" rx="18" fill="#EAF7EF" stroke="#2E8B57" stroke-width="3"/>
      <circle cx="917" cy="146" r="23" fill="#2E8B57"/>
      <text x="917" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
      <text x="1015" y="153" text-anchor="middle" font-size="19" font-weight="700">実装・検証</text>
    </g>

    <!-- 4 MRレビュー -->
    <g filter="url(#one-week-shadow)">
      <rect x="880" y="410" width="250" height="82" rx="18" fill="#FFF2E2" stroke="#F2994A" stroke-width="3"/>
      <circle cx="917" cy="451" r="23" fill="#F2994A"/>
      <text x="917" y="459" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
      <text x="1015" y="458" text-anchor="middle" font-size="19" font-weight="700">MRレビュー</text>
    </g>

    <!-- 5 スプリントレビュー -->
    <g filter="url(#one-week-shadow)">
      <rect x="475" y="425" width="250" height="82" rx="18" fill="#EAF4FF" stroke="#2F80ED" stroke-width="3"/>
      <circle cx="512" cy="466" r="23" fill="#2F80ED"/>
      <text x="512" y="474" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text>
      <text x="618" y="473" text-anchor="middle" font-size="18" font-weight="700">スプリントレビュー</text>
    </g>

    <!-- 6 レトロスペクティブ -->
    <g filter="url(#one-week-shadow)">
      <rect x="70" y="410" width="250" height="82" rx="18" fill="#F2ECFA" stroke="#7B61A8" stroke-width="3"/>
      <circle cx="107" cy="451" r="23" fill="#7B61A8"/>
      <text x="107" y="459" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">6</text>
      <text x="213" y="458" text-anchor="middle" font-size="17" font-weight="700">レトロスペクティブ</text>
    </g>

    <!-- レビューで得るユーザーの声 -->
    <g filter="url(#one-week-shadow)">
      <path d="M738 511 L709 488" fill="none" stroke="#F2994A" stroke-width="4" stroke-linecap="round" marker-end="url(#one-week-arrow-orange)"/>
      <rect x="738" y="506" width="150" height="40" rx="20" fill="#FFF2E2" stroke="#F2994A" stroke-width="2"/>
      <text x="813"
            y="532"
            text-anchor="middle"
            font-size="16"
            font-weight="700"
            fill="#A85412">ユーザーの声</text>
    </g>

    <!-- 章の結論 -->
    <g>
      <rect x="36" y="603" width="1128" height="54" rx="18" fill="#173B5E"/>
      <rect x="36" y="603" width="1128" height="5" rx="2.5" fill="#F2994A"/>
      <rect x="55" y="615" width="102" height="31" rx="15.5" fill="#F2994A"/>
      <text x="106"
            y="636"
            text-anchor="middle"
            font-size="15"
            font-weight="700"
            fill="#FFFFFF">章の結論</text>
      <text x="175"
            y="638"
            font-size="20"
            font-weight="700"
            fill="#FFFFFF">毎週、完成品ではなく『価値ある検証結果 または 動く成果物』を示す</text>
    </g>
  </g>
</svg>
